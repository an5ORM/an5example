[package]
name = "an5-client"
version = "0.1.0"
edition = "2021"
description = "Generated AN5 ORM client for Rust — type-safe models, filters and query builders."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
