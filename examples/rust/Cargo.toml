[package]
name = "an5example-rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "AN5 ORM example — generated Rust client running CRUD against SQLite."
license = "MIT"

[[bin]]
name = "crud"
path = "src/main.rs"

[dependencies]
an5-client = { path = "../../generated/rust" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The generated client is driver-agnostic: the app picks the driver it needs.
sqlx = { version = "0.8", default-features = false, features = [
    "any",
    "runtime-tokio",
    "sqlite",
] }

# `an5-adapters` is not on crates.io yet, so it is patched to a local checkout
# at run time by test/rust-example-build.js, which discovers the workspace path.
# A relative [patch] path is intentionally omitted here: it would only resolve
# inside the monorepo and break in a standalone an5example clone.
